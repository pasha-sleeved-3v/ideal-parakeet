<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: #f1f5f9;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .calculator {
      width: min(100%, 340px);
      padding: 1.25rem;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 16px 40px rgb(15 23 42 / 12%);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
      text-align: center;
    }

    #display {
      width: 100%;
      height: 4.5rem;
      margin-bottom: 1rem;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 0.65rem;
      background: #f8fafc;
      color: inherit;
      font: inherit;
      font-size: 2rem;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
    }

    button {
      min-height: 3.5rem;
      border: 0;
      border-radius: 0.65rem;
      background: #e2e8f0;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: 1.2rem;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover { background: #cbd5e1; }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 3px solid #60a5fa; outline-offset: 2px; }
    .operator { background: #dbeafe; color: #1d4ed8; }
    .operator:hover { background: #bfdbfe; }
    .clear { background: #fee2e2; color: #b91c1c; }
    .clear:hover { background: #fecaca; }
    .equals { grid-column: span 2; background: #2563eb; color: #fff; }
    .equals:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Simple Calculator</h1>
    <input id="display" type="text" value="0" aria-label="Calculator display" readonly>
    <div class="keys">
      <button class="clear" data-action="clear">AC</button>
      <button class="operator" data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="operator" data-value="/" aria-label="Divide">÷</button>
      <button class="operator" data-value="*" aria-label="Multiply">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-" aria-label="Subtract">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+" aria-label="Add">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="." aria-label="Decimal point">.</button>

      <button data-value="0">0</button>
      <button class="equals" data-action="calculate">=</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    const keys = document.querySelector(".keys");
    let expression = "";
    let justCalculated = false;

    function updateDisplay(value = expression) {
      display.value = value || "0";
    }

    function append(value) {
      const isOperator = ["+", "-", "*", "/"].includes(value);
      if (justCalculated && !isOperator) expression = "";
      justCalculated = false;

      if (isOperator) {
        if (!expression && value !== "-") return;
        if (/[+\-*/]$/.test(expression)) {
          expression = expression.slice(0, -1) + value;
        } else {
          expression += value;
        }
      } else if (value === ".") {
        const currentNumber = expression.split(/[+\-*/]/).pop();
        if (currentNumber.includes(".")) return;
        expression += currentNumber ? "." : "0.";
      } else {
        expression += value;
      }
      updateDisplay();
    }

    function calculate() {
      if (!expression || /[+\-*/.]$/.test(expression)) return;
      try {
        // Only calculator digits and operators are allowed in the expression.
        if (!/^[\d.+*/-]+$/.test(expression)) throw new Error("Invalid input");
        const result = Function(`"use strict"; return (${expression})`)();
        if (!Number.isFinite(result)) throw new Error("Invalid result");
        expression = String(Number(result.toFixed(10)));
        updateDisplay();
        justCalculated = true;
      } catch {
        expression = "";
        updateDisplay("Error");
        justCalculated = true;
      }
    }

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      const { action, value } = button.dataset;

      if (action === "clear") {
        expression = "";
        justCalculated = false;
        updateDisplay();
      } else if (action === "delete") {
        expression = expression.slice(0, -1);
        justCalculated = false;
        updateDisplay();
      } else if (action === "calculate") {
        calculate();
      } else if (value) {
        append(value);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[\d.+*/-]$/.test(event.key)) append(event.key);
      else if (event.key === "Enter" || event.key === "=") calculate();
      else if (event.key === "Backspace") {
        expression = expression.slice(0, -1);
        updateDisplay();
      } else if (event.key === "Escape") {
        expression = "";
        justCalculated = false;
        updateDisplay();
      }
    });
  </script>
</body>
</html>
